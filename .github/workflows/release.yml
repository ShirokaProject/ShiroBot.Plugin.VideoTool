name: Build and release plugin

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Install conversion tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg gifsicle
      - name: Verify conversion and message handling
        run: dotnet run --project Tests/VideoTool.Verification.csproj
      - name: Build release
        run: dotnet build ShiroBot.Plugin.VideoTool.csproj -c Release /p:ContinuousIntegrationBuild=true
      - name: Check plugin and tag versions
        shell: bash
        run: |
          version="$(dotnet msbuild ShiroBot.Plugin.VideoTool.csproj -getProperty:Version -p:Configuration=Release)"
          expected="$version"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            expected="${GITHUB_REF_NAME#v}"
          fi
          dotnet run --project scripts/version-check/VersionCheck.csproj -c Release -- \
            bin/Release/net10.0/ShiroBot.Plugin.VideoTool.dll "$version" "$expected"
      - name: Package
        run: |
          mkdir -p artifacts/package
          cp bin/Release/net10.0/ShiroBot.Plugin.VideoTool.dll artifacts/package/
          cp README.md LICENSE config.example.toml artifacts/package/
          (cd artifacts/package && zip -q ../ShiroBot.Plugin.VideoTool.zip ShiroBot.Plugin.VideoTool.dll README.md LICENSE config.example.toml)
          cp bin/Release/net10.0/ShiroBot.Plugin.VideoTool.dll artifacts/
      - uses: actions/upload-artifact@v4
        with:
          name: plugin-package
          path: |
            artifacts/ShiroBot.Plugin.VideoTool.zip
            artifacts/ShiroBot.Plugin.VideoTool.dll
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plugin-package
          path: artifacts
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" artifacts/ShiroBot.Plugin.VideoTool.zip artifacts/ShiroBot.Plugin.VideoTool.dll --clobber
          else
            gh release create "$tag" artifacts/ShiroBot.Plugin.VideoTool.zip artifacts/ShiroBot.Plugin.VideoTool.dll --title "$tag" --generate-notes
          fi
